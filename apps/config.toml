# The tools every machine gets, servers included: the language toolchains,
# prebuilt binaries, and my own tools built from source. Desktops and laptops add
# apps/mise-desktop.toml on top (./setup links it into ~/.config/mise/conf.d),
# and corp hosts add apps/mise-corp.toml the same way.
#
# A tool belongs here only if a headless server wants it.

[tools]
rust = "latest"
go = "latest"
node = "24.14.1"
python = "latest"
bun = "latest"
zig = "latest"
"github:astral-sh/uv" = "latest"
rclone = "latest"

# The stable release, as the prebuilt tarball (aqua:neovim/neovim).
neovim = "latest"

# Prebuilt (aqua:junegunn/fzf, aqua:BurntSushi/ripgrep) rather than the go: and
# cargo: builds, so there is nothing to compile to have them.
fzf = "latest"
ripgrep = "latest"

# `fd` resolves to aqua:sharkdp/fd -- the prebuilt binary, named `fd` (Debian's
# apt package calls it `fdfind`). `find` is aliased to it in the shell rc.
fd = "latest"

# `claude` resolves to aqua:anthropics/claude-code -- the prebuilt native
# binary. Not the npm package: mise's npm backend (aube) blocks postinstall
# scripts, and @anthropic-ai/claude-code is a stub whose postinstall is what
# fetches the real binary, so an npm: install lands broken.
#
# Keep this the ONLY claude on the box. A `npm i -g @anthropic-ai/claude-code`
# lands in node's own prefix (installs/node/<ver>/bin), which sits ahead of
# installs/claude/latest on PATH -- so it silently shadows this one, and mise
# cannot upgrade it (it is a package inside a tool, not a tool). The symptom is
# `update_mise.sh` reporting success for weeks while `claude --version` never
# moves. Check with `mise which claude`: it must point under installs/claude/.
claude = "latest"

# My own tools, built from their main branch with the rust above.
# seal unlocks the sealed files in ~/dotfiles/encrypted, which a server needs too.
"cargo:https://github.com/jeffjose/seal" = "branch:main"
# twig draws the shell prompt, so every machine needs it, corp included.
"cargo:https://github.com/jeffjose/twig" = "branch:main"
"cargo:https://github.com/jeffjose/mediainfo" = "branch:main"
"cargo:https://github.com/jeffjose/safeclean" = "branch:main"
"cargo:https://github.com/jeffjose/magicfs" = "branch:main"

[settings]
experimental = true

# mise quarantines releases younger than `minimum_release_age` (a supply-chain
# guard: a malicious version that gets yanked within a day never reaches you).
# The default window is ~24h, and Claude Code ships several times a day -- so
# `mise install`/`mise upgrade` resolve `latest` to whatever shipped yesterday
# and the newest build is permanently out of reach. The only clue is one line
# that `mise install` does not print:
#
#   mise WARN  1 newer claude release hidden by minimum_release_age
#
# Exempt it by name rather than setting minimum_release_age = 0, which would
# drop the guard for every tool here. Same reasoning as
# AUBE_ALLOWED_UNPOPULAR_PACKAGES below: narrow the exception, keep the check.
minimum_release_age_excludes = ["claude"]
