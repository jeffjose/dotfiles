# The tools only a desktop or laptop gets, on top of apps/config.toml. ./setup
# links this file to ~/.config/mise/conf.d/desktop.toml when the machine's
# profile is `desktop` (see scripts/lib/host.sh) and takes the link away on a
# server.

[tools]
go = "latest"
java = "latest"
node = "24.14.1"
# `pnpm` resolves to aqua:pnpm/pnpm -- the prebuilt native binary. Not npm:pnpm:
# since pnpm 11 the npm package ships a placeholder whose postinstall swaps in
# the real binary from @pnpm/exe.<platform>, and mise's npm backend (aube)
# blocks postinstall scripts. The @pnpm/exe payload lands on disk but nothing
# puts it in place, so `pnpm --version` dies in node's ESM loader on the
# shebang-less placeholder. Same failure as claude and opencode below.
pnpm = "latest"
python = "latest"
bun = "latest"
zig = "0.14.0"
# Static Rust binary (aqua:typst/typst). There is an npm package, but it is a
# wrapper that downloads this same binary, so take it straight.
typst = "latest"
yt-dlp = "latest"
"github:endevco/aube" = "latest"
"aqua:schollz/croc" = "latest"

# Same story for `opencode` (aqua:anomalyco/opencode): the npm package
# opencode-ai is a stub whose postinstall fetches the real binary, so an npm:
# install exits with "postinstall script was not run".
opencode = "latest"

# JSON utilities
#"go:github.com/tomnomnom/gron" = "latest"
#"go:github.com/josephburnett/jd" = "latest"

# CLI utilities
